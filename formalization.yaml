        (pi, 20260923-133354-f1205a45), two simplices and a two-edge tail (Cursor,
        20260923-133355-d0e88449), spherical placements and poles (Cursor,
        20260923-140417-148549b7), the point off the sphere (pi, 20260923-141330-380566a5), Lemma 11
        and Corollary 12 (Cursor, 20260923-142253-71337cc7), the cross-polytope lemma (pi,
        20260923-144608-a0dcc39d), Proposition 2 (Cursor 20260923-144829-ee14f2dc; Codex gpt-6-sol
        20260923-155153-0b801fd1 and 20260923-161545-e38c2a67), the induction's definitions and
