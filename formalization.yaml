# formalization.yaml v0.4, written to Palomar's stricter rules. Before submitting:
# - replace every {{…}};
# - validate against the v0.4 schema and Palomar's own loader;
# - take every model name from a run log, never from memory.
# Worked example: projects/Erdos1007/formalization.yaml.
# Rules and commands: the Math workspace's docs/research/2026-09-22-palomar-submission-path.md.
version: "v0.4"

project:
  name: "Frankl-Kupavskii-Swanepoel Theorem 3: fewer than C(d+2,2) edges embeds in R^d"
  # The registry abstract, at most 10,000 characters: the mathematical content and the principal
  # results, readable without the repository.
  description: >-
    For every integer d ≥ 4, every finite simple graph with fewer than C(d + 2, 2) edges has an
    injective placement in Euclidean d-space under which every edge has length 1, and the complete
    graph K_{d+2} has exactly C(d + 2, 2) edges and has no such placement. Equivalently, f(d) =
    C(d + 2, 2), where f(d) is the least number of edges in a finite simple graph with no
    unit-distance representation in R^d. Non-edges may also lie at distance 1. Finite simple
    graphs are represented as SimpleGraph (Fin n), including the empty graph. The proof is
    Frankl–Kupavskii–Swanepoel Theorem 3, already proved in the GraphDimension library and
    imported here. The spherical half of the same theorem is not stated.
  authors:                 # humans only; credit models under `automation`
    - "Dishant Shah"
  responsible_maintainers:
    - "Dishant Shah"
  license: "Apache-2.0"    # must match the root LICENSE exactly

classification:            # one to eight codes from Palomar's taxonomy snapshots
  arxiv: ["math.CO", "math.MG"]    # arXiv 1802.03092: primary math.CO, cross-list math.MG
  msc2020: ["05C62", "52C10"]      # geometric representations of graphs; Erdős problems in discrete geometry

# `type` is one of paper, book, web discussion, folklore, original-proof or other. At least one
# source must formalize, adapt or independently prove the result, which makes it source-based.
sources:
  - title: "Embedding graphs in Euclidean space"
    authors:
      - "Nóra Frankl"
      - "Andrey Kupavskii"
      - "Konrad J. Swanepoel"
    id: "https://arxiv.org/abs/1802.03092"
    type: "paper"
    location: >-
      J. Combin. Theory Ser. A 171 (2020) 105146, Theorem 3; arXiv:1802.03092, main.tex,
      the definition of f(d) at line 82 and the theorem labeled d+2 choose 2 at line 91
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The proof of record. The frozen statement is the finite simple reading of the Euclidean
      clause: d ≥ 4, graphs SimpleGraph (Fin n), fewer than C(d + 2, 2) edges, and K_{d+2} at
      equality. The spherical clause of the same theorem is not included.

# The cached formal-conjectures tree has no declaration of this theorem. The statement was
# written in this repository.
related_formalizations: []

status:
  scope: >-
    The Euclidean edge threshold f(d) = C(d + 2, 2) for finite simple graphs and every natural
    number d ≥ 4, including the sharpness example K_{d+2}. The spherical clause of Theorem 3 is
    out of scope.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "FKSEdgeThreshold.Palomar.target"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

fidelity:
  divergences: >-
    The printed theorem says "any graph" for d > 3. The frozen statement uses finite simple
    graphs, SimpleGraph (Fin n), because the proof deletes vertices of degree at most d - 2 and
    compares finite edge counts; an infinite edgeless graph need not inject into R^d. For a
    natural number, d > 3 is 4 ≤ d. Edge counts are natural numbers, so fewer than C(d + 2, 2)
    is at most C(d + 2, 2) - 1. Statement B was authored as a theorem whose proof was sorry.
    The manager replaced that theorem by the definition
    FKSEdgeThreshold.StatementB.edgeThreshold, keeping the statement text, so the file
    elaborates under warningAsError. B inlines the placement condition; A names it
    UnitDistanceRealizable. FKSEdgeThreshold.Stage1.Equivalence.edgeThresholdIff proves the two
    claims agree. The fidelity audit reads definition bodies, so B's drop of the anonymous
    hypothesis 4 ≤ d is the definition edgeThreshold.drop1, the same negation as the authored
    theorem edgeThreshold.dropHdim, and edgeThreshold.witness conjoins the authored
    satisfiability instance with the claim.

automation:
