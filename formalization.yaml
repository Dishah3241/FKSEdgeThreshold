  spend_usd: "subscription-based usage"
  notes: >-
    The proof lives in the GraphDimension library, required as a git dependency pinned to
    103e26bc705a61f93ef7985c74498668cbdf7e01. The managing agent (Claude Code, Claude Opus 5.5), directed by
    the human maintainer, wrote the blueprint and every worker brief, fixed the definitions (FKSStatement, fksBudget,
    completeMinusTriangle, SphereEmbeddable), verified and landed every run, and found and
    repaired the gap in FKS's Case 2 at d = 3 (Math finding A38) before the proof was written.
    Stage 1's two authors worked blind but from briefs that fixed the reading of the paper in
    advance (finite simple graphs, injective placements, unconstrained non-edges, d ≥ 4, the
    K_{d+2} clause), so A ↔ B guards against encoding drift, not against a misreading of the
    paper; the owner's Compass review and the independent review check that reading.

limitations: >-
  The frozen statement is the finite simple reading of the Euclidean clause of Theorem 3. The
  spherical clause, realizability on the sphere of radius 1/sqrt(2) for graphs avoiding
  K_{d+2} - K_3 and K_{d+1}, is not stated. The proof depends on GraphDimension, pinned at
  103e26bc705a61f93ef7985c74498668cbdf7e01.

